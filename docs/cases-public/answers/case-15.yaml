# 공개 사례 1절 15번의 업무 구조만 합성했다. 실제 회사·제품·수치 없음.
# 1절 예상: 문구 차이 ② · 중요도 ③ · 법률 ④. 과잉 후보: 문구 차이.
# 요약에 없음(기본값, 확인 필요): frequency, batch_size, exception_rate, minutes_per_item, existing_feature.
# inferred: 1절 요약이 직접 말하지 않아 업무 구조에서 추정한 답.
name: case-15
task: 두 계약서의 문구 차이를 찾고, 차이의 중요도를 매기고, 법률 검토는 사람이 한다
steps:
  # 문구 차이는 문자열 비교 규칙으로 찾는다(②). 입력은 계약서 글이다. 지금 AI가 매번 한다(과잉 후보).
  - name: 계약서 문구 차이 찾기
    answers: {input_kind: free_doc, rule_expressible: yes, current_actor: ai_each_time, human_signoff: no}
    inferred: [input_kind]
  - name: 차이 중요도 매기기
    answers: {input_kind: free_doc, rule_expressible: no, current_actor: ai_each_time, human_signoff: no}
    inferred: [input_kind, rule_expressible]
  # 사람이 검토하고 책임진다(④). 서명 단계로 읽었다.
  - name: 법률 검토
    answers: {current_actor: human, human_signoff: yes}
    inferred: [human_signoff]
