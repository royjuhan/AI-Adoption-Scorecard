name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AIAdoptionScorecard.sln
      - run: dotnet build AIAdoptionScorecard.sln --no-restore -c Release -warnaserror
      - run: dotnet test AIAdoptionScorecard.sln --no-build -c Release -- RunConfiguration.TreatNoTestsAsError=true

  # 바뀐 src/**/*.cs만 Stryker.NET으로 head·base 양쪽에서 돌린다(ADR 0005 원문 2). 규칙: tools/ci/README.md
  mutation:
    runs-on: ubuntu-latest
    # mutation.py 전체 100분(--budget-minutes), 한 번 실행 50분. 넘으면 status: timeout으로 mutation.json을 쓴다.
    timeout-minutes: 120
    env:
      # base: PR이면 base 브랜치 끝 커밋, main push면 push 전 끝 커밋(event.before).
      # 비었거나 0 40개·저장소에 없으면 head의 첫 부모(HEAD~1)로 정한다(tools/ci/cigit.py, 위 "base 도구 꺼내기"와 같은 규칙).
      # head: checkout한 커밋(github.sha). PR이면 GitHub가 만든 병합 커밋(refs/pull/N/merge)이다.
      CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 검증 도구는 base 커밋의 것을 돈다(PR이 도구를 약하게 바꿔 자기 PR을 통과시키지 못하게). tools/ci/README.md "도구 출처".
      # base에 없으면 head의 것(부트스트랩: base main에 tools/ci가 없는 T-010 PR).
      - name: base 도구 꺼내기
        run: |
          set -euo pipefail
          base=$(git rev-parse --verify --quiet "${CI_BASE:-none}^{commit}" || git rev-parse HEAD^1)
          dest="$RUNNER_TEMP/base-tools"
          rm -rf "$dest" && mkdir -p "$dest"
          if git cat-file -e "$base:tools/ci/regression_guard.py" 2>/dev/null; then
            git archive "$base" tools/ci | tar -x -C "$dest"
            echo "CI_TOOLS=$dest/tools/ci" >> "$GITHUB_ENV"
            echo "CI_TOOLS_SOURCE=base" >> "$GITHUB_ENV"
          else
            echo "CI_TOOLS=$GITHUB_WORKSPACE/tools/ci" >> "$GITHUB_ENV"
            echo "CI_TOOLS_SOURCE=head" >> "$GITHUB_ENV"
          fi
          if git cat-file -e "$base:tools/oracle/check.py" 2>/dev/null; then
            git archive "$base" tools/oracle | tar -x -C "$dest"
            echo "CI_ORACLE=$dest/tools/oracle" >> "$GITHUB_ENV"
            echo "CI_ORACLE_SOURCE=base" >> "$GITHUB_ENV"
            echo "CI_ORACLE_REV=$base" >> "$GITHUB_ENV"
          else
            echo "CI_ORACLE=$GITHUB_WORKSPACE/tools/oracle" >> "$GITHUB_ENV"
            echo "CI_ORACLE_SOURCE=head" >> "$GITHUB_ENV"
            echo "CI_ORACLE_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          echo "CI_TOOLS_REV=$base" >> "$GITHUB_ENV"
          echo "도구 출처: base $base, tools/ci는 $( [ -f "$dest/tools/ci/regression_guard.py" ] && echo base || echo head ), tools/oracle은 $( [ -f "$dest/tools/oracle/check.py" ] && echo base || echo head )"
      # Stryker 버전은 base 커밋의 .config/dotnet-tools.json(없으면 head)으로 mutation.py가 worktree마다 restore한다.
      - name: mutation 측정
        run: python3 "$CI_TOOLS/mutation.py" --repo . --base "$CI_BASE" --head HEAD --out mutation.json --work "$RUNNER_TEMP/mutation" --budget-minutes 100
      - name: mutation.json 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-result
          path: mutation.json
          if-no-files-found: warn
      - name: Stryker 보고서·로그 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            ${{ runner.temp }}/mutation/out/**/reports/mutation-report.json
            ${{ runner.temp }}/mutation/logs/*.log
          if-no-files-found: ignore

  # tools/oracle/(Python 독립 구현)이 예제 expected/와 같은 바이트를 내는지 본다(ADR 0005 원문 3).
  # base 커밋의 oracle로 head의 예제를 본다. tools/oracle이 바뀌었으면 head oracle로도 본다(둘 다 match여야 녹색).
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # base: PR이면 base 브랜치 끝 커밋, main push면 push 전 끝 커밋(event.before).
      # 비었거나 0 40개·저장소에 없으면 head의 첫 부모(HEAD~1)로 정한다(tools/ci/cigit.py, 위 "base 도구 꺼내기"와 같은 규칙).
      # head: checkout한 커밋(github.sha). PR이면 GitHub가 만든 병합 커밋(refs/pull/N/merge)이다.
      CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 검증 도구는 base 커밋의 것을 돈다(PR이 도구를 약하게 바꿔 자기 PR을 통과시키지 못하게). tools/ci/README.md "도구 출처".
      # base에 없으면 head의 것(부트스트랩: base main에 tools/ci가 없는 T-010 PR).
      - name: base 도구 꺼내기
        run: |
          set -euo pipefail
          base=$(git rev-parse --verify --quiet "${CI_BASE:-none}^{commit}" || git rev-parse HEAD^1)
          dest="$RUNNER_TEMP/base-tools"
          rm -rf "$dest" && mkdir -p "$dest"
          if git cat-file -e "$base:tools/ci/regression_guard.py" 2>/dev/null; then
            git archive "$base" tools/ci | tar -x -C "$dest"
            echo "CI_TOOLS=$dest/tools/ci" >> "$GITHUB_ENV"
            echo "CI_TOOLS_SOURCE=base" >> "$GITHUB_ENV"
          else
            echo "CI_TOOLS=$GITHUB_WORKSPACE/tools/ci" >> "$GITHUB_ENV"
            echo "CI_TOOLS_SOURCE=head" >> "$GITHUB_ENV"
          fi
          if git cat-file -e "$base:tools/oracle/check.py" 2>/dev/null; then
            git archive "$base" tools/oracle | tar -x -C "$dest"
            echo "CI_ORACLE=$dest/tools/oracle" >> "$GITHUB_ENV"
            echo "CI_ORACLE_SOURCE=base" >> "$GITHUB_ENV"
            echo "CI_ORACLE_REV=$base" >> "$GITHUB_ENV"
          else
            echo "CI_ORACLE=$GITHUB_WORKSPACE/tools/oracle" >> "$GITHUB_ENV"
            echo "CI_ORACLE_SOURCE=head" >> "$GITHUB_ENV"
            echo "CI_ORACLE_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          echo "CI_TOOLS_REV=$base" >> "$GITHUB_ENV"
          echo "도구 출처: base $base, tools/ci는 $( [ -f "$dest/tools/ci/regression_guard.py" ] && echo base || echo head ), tools/oracle은 $( [ -f "$dest/tools/oracle/check.py" ] && echo base || echo head )"
      - name: oracle 대조
        run: |
          set -uo pipefail
          status=0
          echo "oracle: $CI_ORACLE_SOURCE ($CI_ORACLE_REV)"
          python3 "$CI_ORACLE/check.py" --repo . --json oracle.json || status=1
          tree=$(git rev-parse "$CI_ORACLE_REV:tools/oracle")
          printf '{"schema_version": 1, "source": "%s", "rev": "%s", "tree": "%s"}\n' "$CI_ORACLE_SOURCE" "$CI_ORACLE_REV" "$tree" > oracle-source.json
          if [ "$CI_ORACLE_SOURCE" = base ] && ! git diff --quiet "$CI_ORACLE_REV" HEAD -- tools/oracle; then
            echo "tools/oracle이 바뀌었다. head oracle로도 대조한다(결과는 oracle-head.json, regression-guard는 쓰지 않는다)"
            python3 tools/oracle/check.py --repo . --json oracle-head.json || status=1
          fi
          exit $status
      - name: oracle.json 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-result
          path: |
            oracle.json
            oracle-source.json
            oracle-head.json
          if-no-files-found: warn

  # PR base 대비 회귀 신호를 막는다(ADR 0005 원문 1). mutation·oracle이 실패해도 결과 파일을 읽고 판단한다.
  # base 커밋의 tools/ci를 돌린다(--require-base-tools). base·head에서 같은 명령으로 dotnet test를 돌려 TRX를 비교한다.
  regression-guard:
    needs: [mutation, oracle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # base: PR이면 base 브랜치 끝 커밋, main push면 push 전 끝 커밋(event.before).
      # 비었거나 0 40개·저장소에 없으면 head의 첫 부모(HEAD~1)로 정한다(tools/ci/cigit.py, 위 "base 도구 꺼내기"와 같은 규칙).
      # head: checkout한 커밋(github.sha). PR이면 GitHub가 만든 병합 커밋(refs/pull/N/merge)이다.
      CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 검증 도구는 base 커밋의 것을 돈다(PR이 도구를 약하게 바꿔 자기 PR을 통과시키지 못하게). tools/ci/README.md "도구 출처".
      # base에 없으면 head의 것(부트스트랩: base main에 tools/ci가 없는 T-010 PR).
      - name: base 도구 꺼내기
        run: |
          set -euo pipefail
          base=$(git rev-parse --verify --quiet "${CI_BASE:-none}^{commit}" || git rev-parse HEAD^1)
          dest="$RUNNER_TEMP/base-tools"
          rm -rf "$dest" && mkdir -p "$dest"
          if git cat-file -e "$base:tools/ci/regression_guard.py" 2>/dev/null; then
            git archive "$base" tools/ci | tar -x -C "$dest"
            echo "CI_TOOLS=$dest/tools/ci" >> "$GITHUB_ENV"
            echo "CI_TOOLS_SOURCE=base" >> "$GITHUB_ENV"
          else
            echo "CI_TOOLS=$GITHUB_WORKSPACE/tools/ci" >> "$GITHUB_ENV"
            echo "CI_TOOLS_SOURCE=head" >> "$GITHUB_ENV"
          fi
          if git cat-file -e "$base:tools/oracle/check.py" 2>/dev/null; then
            git archive "$base" tools/oracle | tar -x -C "$dest"
            echo "CI_ORACLE=$dest/tools/oracle" >> "$GITHUB_ENV"
            echo "CI_ORACLE_SOURCE=base" >> "$GITHUB_ENV"
            echo "CI_ORACLE_REV=$base" >> "$GITHUB_ENV"
          else
            echo "CI_ORACLE=$GITHUB_WORKSPACE/tools/oracle" >> "$GITHUB_ENV"
            echo "CI_ORACLE_SOURCE=head" >> "$GITHUB_ENV"
            echo "CI_ORACLE_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          echo "CI_TOOLS_REV=$base" >> "$GITHUB_ENV"
          echo "도구 출처: base $base, tools/ci는 $( [ -f "$dest/tools/ci/regression_guard.py" ] && echo base || echo head ), tools/oracle은 $( [ -f "$dest/tools/oracle/check.py" ] && echo base || echo head )"
      - name: 자기 검사(돌릴 tools/ci의 단위 테스트)
        run: python3 -m unittest discover -s "$CI_TOOLS" -p "test_*.py" -v
      - name: 자기 검사(head tools/ci가 바뀌었으면 head 것도)
        if: env.CI_TOOLS_SOURCE == 'base'
        run: |
          if git diff --quiet "$CI_TOOLS_REV" HEAD -- tools/ci; then echo "tools/ci 변경 없음"; exit 0; fi
          python3 -m unittest discover -s tools/ci -p "test_*.py" -v
      - name: test-run(base·head에서 같은 명령으로 dotnet test, TRX)
        continue-on-error: true
        run: python3 "$CI_TOOLS/testrun.py" --repo . --base "$CI_BASE" --head HEAD --out testrun.json --work "$RUNNER_TEMP/testrun"
      - name: mutation 결과 받기
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mutation-result
          path: ci-results/mutation
      - name: oracle 결과 받기
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: oracle-result
          path: ci-results/oracle
      - name: regression-guard
        env:
          MUTATION_RESULT: ${{ needs.mutation.result }}
          ORACLE_RESULT: ${{ needs.oracle.result }}
        run: >-
          python3 "$CI_TOOLS/regression_guard.py" --repo . --base "$CI_BASE" --head HEAD
          --require-base-tools
          --mutation ci-results/mutation/mutation.json
          --oracle ci-results/oracle/oracle.json
          --oracle-source ci-results/oracle/oracle-source.json
          --testrun testrun.json
          --json-out regression-guard.json
      - name: regression-guard.json·testrun.json 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-guard-result
          path: |
            regression-guard.json
            testrun.json
          if-no-files-found: warn
      - name: test-run 로그 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrun-logs
          path: ${{ runner.temp }}/testrun/logs/*.log
          if-no-files-found: ignore
