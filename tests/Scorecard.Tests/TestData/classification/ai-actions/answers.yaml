# 합성 예시. 실제 업무·값 없음. 가상 시나리오(T-022): 동작 목록(actions), 네 칸 문장, 담당자 확인 메모, 케이스 메모.
name: ai-actions
task: 합성 설문 회신을 모아 빈칸·단위를 보고 확인 요청을 보낸 뒤 원본과 대조해 승인한다
scenario: virtual
summary:
  scale: 연 1회, 집중 기간 10주, 주 10건 안팎
  current: 담당자 한 명이 메일로 받아 손으로 정리한다
  exception_rate: 열 건 가운데 두세 건은 다시 묻는다
  delivery: 승인한 자료를 분석 담당에게 넘긴다
stated_numbers:
  - 연 1회, 집중 기간 10주
  - 주 10건
  - 예외 1건 처리에 15분(예외 1건 전체 기준, 한 단계의 시간이 아님)
self_check:
  - {rule: R1 출처 없는 단정 0건, result: pass}
  - {rule: R2 집계는 stated만, result: pass}
  - {rule: R3 ①은 손이 안 가는 경우만, result: pass, note: ① 단계 없음}
  - {rule: R4 추천 문장에 이유, result: pass}
  - {rule: R5 종료점 문장, result: pass}
open_questions:
  - 현재 설문에서 필수 칸을 비우거나 잘못된 단위를 넣으면 제출이 막히나요?
end_state: 업무 구조 검토 완료. 지금 제출할 것 없음.
steps:
  - name: 회신 받아 모으기
    answers: {input_kind: fixed_form, rule_expressible: yes, frequency: weekly, batch_size: 10, exception_rate: 0, current_actor: human, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: unknown, human_signoff: no}
    inferred: [frequency]
    ai:
      assignee: ②
      reason: 메일을 열고 첨부를 내려받아 업체별로 모으는 동작은 모두 규칙으로 할 수 있다.
      actions:
        - {action: 회신 메일 열기, who_now: human, proposed: ②, source: stated}
        - {action: 첨부 내려받기, who_now: human, proposed: ②, source: stated}
        - {action: 업체별 폴더에 넣기, who_now: human, proposed: ②, source: inferred}
        - {action: 빠진 업체 찾기, who_now: human, proposed: ②, source: inferred}
      now: 담당자가 메일을 하나씩 열어 첨부를 내려받는다.
      change: 받은 회신을 업체별로 모으고 빠진 업체 목록을 내는 규칙을 둔다.
      check: 지금 쓰는 메일·설문 도구에 회신 모으기 기능이 있는지 본다.
  - name: 빈칸·단위 검사
    answers: {input_kind: fixed_form, rule_expressible: partial, frequency: weekly, batch_size: 10, exception_rate: 25, current_actor: human, failure_impact: internal_rework, existing_feature: unknown, human_signoff: no}
    ai:
      assignee: ②
      reason: 빈칸·숫자 형식·허용 단위는 규칙으로 검사할 수 있다. 보고 기간·범위가 원본 뜻과 맞는지는 규칙으로 안 된다.
      actions:
        - {action: 빈칸 찾기, who_now: human, proposed: ②, source: stated}
        - {action: 단위가 허용 목록에 있는지 보기, who_now: human, proposed: ②, source: stated}
        - {action: 보고 기간이 원본 뜻과 맞는지 보기, who_now: human, proposed: ④, source: inferred}
      check: 현재 설문에서 필수 칸을 비우거나 잘못된 단위를 넣으면 제출이 막히나요?
  - name: 확인 요청 쓰기
    answers: {input_kind: free_doc, rule_expressible: partial, frequency: weekly, batch_size: 3, exception_rate: 30, current_actor: human, minutes_per_item: 15, failure_impact: external, existing_feature: no, human_signoff: no}
    ai:
      assignee: ③
      reason: 사유 네 가지(수치 불일치·기간 누락·단위 누락·범위 불명확)는 양식에 값을 넣으면 되고, 묶이지 않는 복합 건만 AI 초안이 필요하다.
      actions:
        - {action: 사유 고르기, who_now: human, proposed: ②, source: stated}
        - {action: 양식에 값 넣기, who_now: human, proposed: ②, source: stated}
        - {action: 복합 건 초안 쓰기, who_now: human, proposed: ③, source: stated}
        - {action: 보내기 전 읽기, who_now: human, proposed: ④, source: stated}
      gate_note: 보내기 전에 담당자가 초안을 읽고 고친다. 4단계 원본 대조 때 함께 본다.
  - name: 원본 대조·최종 승인
    answers: {input_kind: fixed_form, rule_expressible: no, frequency: weekly, batch_size: 10, exception_rate: 10, current_actor: human, failure_impact: external, existing_feature: no, human_signoff: yes}
    ai:
      assignee: ④
      reason: 수정 자료 재검토와 전체 최종 승인 두 활동이 있다. 둘 다 담당자가 판단한다.
