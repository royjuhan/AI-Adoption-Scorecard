# 합성 예시. 실제 업무·값 없음. 가상 시나리오(T-024): 세 역할(roles), 판단·실행·책임, 배분 근거, 업무 이해, 도구 제안, 역할 전환 조건.
name: ai-roles
task: 합성 고객 문의 메일에 이전 기록을 붙여 답을 쓰고, 약속이 걸린 답은 승인한 뒤 보내고 기록한다
scenario: virtual
summary:
  scale: 하루 30건쯤
  current: 담당자가 메일을 열고 이전 기록을 찾아 답을 쓴다
  delivery: 고객에게 메일로 답하고 따로 기록을 남긴다
stated_numbers:
  - 하루 30건쯤
purpose: 고객 문의에 정책에 맞는 답을 빠짐없이 보내고, 약속이 걸린 답은 담당자 책임으로 보낸다.
done_when: 모든 문의에 답이 나가고 이력에 남는다. 약속이 걸린 답에는 담당자 승인 기록이 있다.
facts:
  - 고객 문의 메일이 하루 30건쯤 온다.
  - 담당자가 메일을 열고 이전 문의와 주문 기록을 찾아 답을 쓴다.
  - 환불·일정 약속이 걸린 답은 담당자가 정한다.
assumptions:
  - 자주 오는 문의가 몇 가지 양식으로 묶이는지는 확인되지 않았다.
  - 메일 도구에서 고객 기록을 바로 찾을 수 있는지는 확인되지 않았다.
tools:
  - name: 문의 모으기·기록 조회 도구
    steps: [1, 2]
    function: 새 문의를 모으고 고객 번호로 이전 문의·주문 기록을 찾아 문의에 붙인다.
    input: 메일함 접근 설정과 고객 번호 형식(담당자가 정한다).
    process: 새 메일 모으기 → 정해진 형식으로 고객 번호 찾기 → 기록 조회 → 문의 묶음 저장.
    output: 문의마다 원문, 고객 기록, 고객 번호를 못 찾은 메일 목록.
    reduces: AI가 매번 메일을 열고 기록을 찾는 조회·조작, 담당자가 손으로 기록을 붙이는 일.
    exceptions: 고객 번호가 없거나 둘 이상인 메일은 AI 판단으로 넘기고, 담당자가 2단계 초안을 볼 때 함께 확인한다.
    existing: 메일 도구의 분류·전달 규칙으로 모으기까지 되는지 먼저 본다.
    new: 고객 번호 찾기와 기록 조회 연결.
    burden: 메일과 기록 시스템을 잇는 유지보수가 든다. 호출은 문의마다 한 번이다. 실제로 일이 줄어드는지는 재지 않았다.
  - name: 발송·이력 저장 도구
    steps: [4]
    function: 승인된 답만 보내고 보낸 내용·시각·승인자를 기록한다.
    input: 3단계에서 승인된 답과 받는 사람.
    process: 승인 여부 확인 → 보내기 → 이력 저장 → 실패하면 담당자에게 알림.
    output: 발송 결과와 이력 한 줄.
    reduces: 담당자가 답을 복사해 보내고 따로 기록하는 일.
    exceptions: 발송이 실패하거나 받는 사람 주소가 고객 기록과 다르면 담당자에게 넘긴다.
    existing: 메일 도구의 보내기와 보낸 편지함.
    new: 승인 기록 확인과 이력 저장 연결.
    burden: 승인 기록과 발송을 잇는 작은 규칙이다. 유지보수 부담은 확인되지 않았다.
transitions:
  - step: 2
    from: ③
    to: ②
    condition: 자주 오는 문의가 몇 가지 양식으로 묶이고, 양식 답을 담당자가 거의 고치지 않는다.
    evidence: 문의 유형별 표본, 담당자 수정 기록, 양식 답과 담당자 답을 대조한 check 결과.
  - step: 1
    from: ②
    to: ③
    condition: 고객 번호가 없는 메일이 늘어 규칙으로 고객을 찾지 못하는 건이 많아진다.
    evidence: 규칙으로 붙이지 못한 메일 수와 그 사유 기록(운영 데이터).
open_questions:
  - 자주 오는 문의(배송 조회 같은 것)는 몇 가지 양식으로 묶이나요?
self_check:
  - {rule: R1 출처 없는 단정 0건, result: pass}
  - {rule: R2 집계는 stated만, result: pass}
  - {rule: R3 ①은 손이 안 가는 경우만, result: pass, note: ① 단계 없음}
  - {rule: R4 추천 문장에 이유, result: pass}
  - {rule: R5 종료점 문장, result: pass}
end_state: 업무 구조 검토 완료. 지금 제출할 것 없음.
steps:
  - name: 문의 모으기와 기록 붙이기
    answers: {input_kind: free_doc, rule_expressible: yes, frequency: daily, batch_size: 30, current_actor: human, failure_impact: internal_rework, existing_feature: unknown, human_signoff: no}
    ai:
      assignee: ②
      reason: 메일을 모으고 고객 번호로 이전 기록을 찾아 붙이는 일은 규칙으로 할 수 있다. 고객 번호가 없는 메일을 누구 것으로 볼지는 규칙으로 안 된다.
      actions:
        - {action: 메일 열기, who_now: human, proposed: ②, source: stated}
        - {action: 이전 문의와 주문 기록 찾기, who_now: human, proposed: ②, source: stated}
        - {action: 고객 번호가 없는 메일의 고객 찾기, who_now: human, proposed: ③, source: inferred}
      roles:
        software: 새 문의 모으기, 고객 번호로 기록 조회, 문의마다 기록 붙이기
        ai: 고객 번호가 없는 메일의 고객 추정(2단계에서 담당자가 함께 확인)
      judgment: 어느 고객의 문의인가.
      execution: 모으기·조회·붙이기는 소프트웨어가 한다.
      accountability: 이 단계에서 책임을 인수하는 지점은 없다. 잘못 붙인 기록은 2단계 초안을 볼 때 드러난다.
      basis: 메일 내용과 고객 번호는 매번 달라도 조회 규칙은 같다. 붙인 기록 수와 못 찾은 메일 목록으로 결과를 확인한다.
      varies: 입력값(메일·고객 번호)이 달라진다. 맥락 해석은 고객 번호가 없을 때만 필요하다.
  - name: 의도 해석과 답변 초안
    answers: {input_kind: free_doc, rule_expressible: partial, frequency: daily, batch_size: 30, current_actor: human, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
    inferred: [rule_expressible]
    ai:
      assignee: ③
      reason: 문의 의도와 예외는 건마다 맥락을 읽어야 해 AI 초안 + 담당자 확인이다. 자주 오는 문의가 묶이는지 확인되지 않았다. 묶이면 양식(규칙), 안 묶이는 건만 AI 초안이다.
      actions:
        - {action: 문의 읽기, who_now: human, proposed: ③, source: stated}
        - {action: 답 쓰기, who_now: human, proposed: ③, source: stated}
        - {action: 정책 문서 찾기, who_now: human, proposed: ②, source: inferred}
      roles:
        ai: 문의 의도 해석, 맞는 정책 고르기, 답변 초안 쓰기
        software: 정책 문서·답변 양식 불러오기, 초안 저장
      judgment: 문의가 무엇을 묻는가, 어떤 정책이 맞는가, 약속이 걸리는가.
      execution: AI가 초안을 쓰고 소프트웨어가 양식에 넣어 저장한다. 약속이 걸린 초안은 3단계로 넘긴다.
      accountability: 초안에서는 책임을 인수하지 않는다. 약속이 걸린 답은 3단계에서 담당자가 승인한다.
      basis: 의도와 예외는 맥락 해석이 매번 필요하다. 정책 문서 찾기는 규칙으로 된다. 초안이 맞는지는 담당자가 3단계와 보내기 전 확인에서 본다.
      varies: 맥락 해석(문의 의도, 예외 사정)이 달라진다.
  - name: 약속이 걸린 답 승인
    answers: {input_kind: free_doc, rule_expressible: no, frequency: daily, batch_size: 5, current_actor: human, failure_impact: external, existing_feature: no, human_signoff: yes}
    ai:
      assignee: ④
      reason: 환불·일정 약속은 고객과의 관계와 신뢰가 걸린 결정이라 담당자가 정한다. 준비(요약·목록)는 AI와 소프트웨어가 하고 담당자는 승인만 한다.
      actions:
        - {action: 약속할지 정하기, who_now: human, proposed: ④, source: stated}
      roles:
        human: 환불·일정·예외 약속을 할지 정하고 승인한다
        ai: 약속 내용과 근거(고객 기록, 정책 조항) 요약
        software: 승인 대기 목록과 승인 기록
      judgment: 이 약속을 할 것인가.
      execution: 승인과 기록은 소프트웨어가 한다.
      accountability: 담당자가 승인으로 약속의 책임을 인수한다.
      basis: 약속은 사람의 의사와 책임이 직접 들어가야 한다. 요약과 목록은 담당자의 준비 일을 줄일 뿐 결정을 대신하지 않는다.
      varies: 사정과 관계(고객 상황, 예외 요청)가 달라진다.
  - name: 보내기와 이력 저장
    answers: {input_kind: fixed_form, rule_expressible: yes, frequency: daily, batch_size: 30, current_actor: human, failure_impact: external, existing_feature: unknown, human_signoff: no}
    ai:
      assignee: ②
      reason: 승인된 답만 보내고 기록하는 일은 정해진 조건이라 규칙으로 할 수 있다. 받는 사람이 기록과 다를 때 어떻게 할지는 규칙으로 안 되어 담당자에게 넘긴다.
      actions:
        - {action: 답 보내기, who_now: human, proposed: ②, source: stated}
        - {action: 기록 남기기, who_now: human, proposed: ②, source: stated}
      gate_note: 3단계 승인 때 받는 사람과 첨부를 함께 본다. 승인되지 않은 답은 보내지 않는다.
      roles:
        software: 승인된 답만 보내기, 보낸 내용·시각·승인자 기록, 실패 알림
      judgment: 보낼 조건(승인됨)은 정해져 있다.
      execution: 보내기와 기록은 소프트웨어가 한다.
      accountability: 책임은 3단계 승인에서 인수했다. 발송 실패는 담당자에게 넘긴다.
      basis: 보낼 답은 매번 달라도 보내는 규칙은 같다. 이력 한 줄과 실패 알림으로 결과를 확인한다.
      varies: 입력값(답 내용·받는 사람)만 달라진다.
