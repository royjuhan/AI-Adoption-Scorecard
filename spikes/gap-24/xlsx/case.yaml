# 합성 예시. 실제 업무·값 없음. 잠재 빈 곳 24 확인용(docs/cases-public/README.md 3절).
# 기준·결과 자료가 xlsx다(사람이 엑셀로 정리).
name: gap-24-xlsx
task: 합성 손글씨 근무표를 읽어 시간을 집계한다
steps:
  - name: 근무표 시간 집계
    answers: {input_kind: image, rule_expressible: yes, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: human, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
inputs:
  reference: reference/*.xlsx
  candidate: candidate/*.xlsx
  key: shift_id
compare:
  - {field: hours, tolerance: 0}
thresholds:
  accuracy_min: 95
  missing_max: 2
  time_must_drop: false
