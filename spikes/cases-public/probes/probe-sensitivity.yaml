# 스파이크 PROBE. 합성. 실제 업무·값 없음.
# answers/의 판단이 갈리는 답을 다르게 했을 때 엔진 결과를 본다(answers/ 파일은 바꾸지 않는다).
name: probe-sensitivity
task: 답이 갈리는 곳의 엔진 결과 확인
steps:
  # ②M 단계를 rule_expressible: partial로 답한 경우(case-09·13·41·46의 1단계 대안).
  - name: 학습 모델을 partial로 답함
    answers: {input_kind: table, rule_expressible: partial, current_actor: ai_each_time, human_signoff: no}
  # 같은 단계에 표본 게이트(external)까지 있는 경우(case-13 대안).
  - name: 학습 모델을 partial로 답함, 게이트 있음
    answers: {input_kind: table, rule_expressible: partial, current_actor: ai_each_time, failure_impact: external, human_signoff: no}
  # 규칙으로 끝나지만 입력이 자유 문서인 단계(case-48 2단계를 free_doc으로 답한 경우).
  - name: 자유 문서 입력, 규칙 가능
    answers: {input_kind: free_doc, rule_expressible: yes, current_actor: ai_each_time, human_signoff: no}
  # 이미지 읽기 단계에 게이트를 단 경우(case-27 1단계 대안. 불확실 건만이 아니라 모든 건 게이트).
  - name: 이미지 읽기, 게이트 있음
    answers: {input_kind: image, rule_expressible: partial, current_actor: ai_each_time, failure_impact: external, human_signoff: no}
  # 불확실 건 확인을 따로 사람 단계로 적은 경우(case-27 대안).
  - name: 불확실한 칸 사람 확인
    answers: {current_actor: human, human_signoff: yes}
