# 합성 예시. 실제 업무·값 없음. 잠재 빈 곳 25 확인용(docs/cases-public/README.md 3절).
name: gap-25-b
task: 합성 메모를 분류하고 건수를 센다
steps:
  - name: 메모 분류
    answers: {input_kind: free_doc, rule_expressible: no, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: human, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
  - name: 건수 세기
    answers: {input_kind: table, rule_expressible: yes, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: human, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
inputs:
  reference: reference/*.csv
  candidate: candidate/*.csv
  key: row_id
compare:
  - {field: amount, tolerance: 0}
thresholds:
  accuracy_min: 95
  missing_max: 2
  time_must_drop: false
