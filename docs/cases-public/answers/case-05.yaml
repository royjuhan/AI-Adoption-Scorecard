# 공개 사례 1절 5번의 업무 구조만 합성했다. 실제 회사·제품·수치 없음.
# 1절 예상: 추출 ③ · 검산·거래처 대조 ②. 과잉 후보: 합계 검산.
# 요약에 없음(기본값, 확인 필요): frequency, batch_size, exception_rate, minutes_per_item, existing_feature.
# inferred: 1절 요약이 직접 말하지 않아 업무 구조에서 추정한 답.
name: case-05
task: 송장에서 항목을 뽑고 합계를 검산한 뒤 거래처 목록과 대조한다
steps:
  - name: 송장 항목 뽑기
    answers: {input_kind: image, rule_expressible: partial, current_actor: ai_each_time, human_signoff: no}
    inferred: [input_kind, rule_expressible]
  # 지금 AI가 매번 검산한다(과잉 후보).
  - name: 합계 검산
    answers: {input_kind: table, rule_expressible: yes, current_actor: ai_each_time, human_signoff: no}
    inferred: [input_kind]
  # 과잉 후보에 없다. 지금 누가 하는지 요약에 없음(current_actor 기본값).
  - name: 거래처 목록 대조
    answers: {input_kind: table, rule_expressible: yes, human_signoff: no}
    inferred: [input_kind]
