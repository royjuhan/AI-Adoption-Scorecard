# 공개 사례 1절 41번의 업무 구조만 합성했다. 실제 회사·제품·수치 없음.
# 1절 예상: ②M · 동의 필터 S · 예산 ④. 과잉 후보: 동의 필터.
# 요약에 없음(기본값, 확인 필요): frequency, batch_size, exception_rate, minutes_per_item, existing_feature.
# inferred: 1절 요약이 직접 말하지 않아 업무 구조에서 추정한 답.
name: case-41
task: 광고 대상과 입찰을 모델로 정하고, 동의하지 않은 사람은 걸러 내며, 예산은 사람이 정한다
steps:
  # 학습 모델(②M). 기준을 글로 쓰지 못하고 자료에서 배운다고 보았다.
  - name: 광고 대상·입찰 정하기
    answers: {input_kind: table, rule_expressible: no, current_actor: ai_each_time, human_signoff: no}
    inferred: [input_kind, rule_expressible]
  # 동의 조건은 법규다(S). 지금 AI가 매번 거른다(과잉 후보).
  - name: 동의 여부 거르기
    answers: {input_kind: table, rule_expressible: yes, current_actor: ai_each_time, failure_impact: safety_legal, human_signoff: no}
    inferred: [input_kind]
  # 사람이 정하고 책임진다(④). 서명 단계로 읽었다.
  - name: 광고 예산 정하기
    answers: {current_actor: human, human_signoff: yes}
    inferred: [human_signoff]
