name: release

# GitHub 릴리스를 발행하면(웹 화면 "Publish release") win-x64 zip을 만들어 그 릴리스에 붙인다(ADR 0017).
# 태그 커밋에서 빌드·테스트가 통과해야만 올린다. 판정·셈과 상관없다(배포 묶음만).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "이미 있는 릴리스의 태그(예: v0.2.0-alpha)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AIAdoptionScorecard.sln
      - run: dotnet build AIAdoptionScorecard.sln --no-restore -c Release -warnaserror
      - run: dotnet test AIAdoptionScorecard.sln --no-build -c Release -- RunConfiguration.TreatNoTestsAsError=true
      - run: dotnet publish src/Scorecard.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: 묶음 만들기
        shell: pwsh
        run: |
          $name = "scorecard-$env:TAG-win-x64"
          New-Item -ItemType Directory -Path "pkg/$name" | Out-Null
          Copy-Item publish/scorecard.exe "pkg/$name/"
          Copy-Item -Recurse examples "pkg/$name/examples"
          Get-ChildItem "pkg/$name/examples" -Recurse -Directory -Filter out | Remove-Item -Recurse -Force
          Copy-Item tools/release/1-예제-돌려보기.bat "pkg/$name/"
          Copy-Item tools/release/사용법.txt "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$name.zip.sha256", "$hash  $name.zip`n")
          Get-Content "$name.zip.sha256"
      - name: 릴리스에 붙이기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "scorecard-$env:TAG-win-x64"
          gh release upload $env:TAG "$name.zip" "$name.zip.sha256" --clobber --repo $env:GITHUB_REPOSITORY
