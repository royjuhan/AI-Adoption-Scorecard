# 합성 예시. 실제 업무·값 없음. 잠재 빈 곳 21 확인용(docs/cases-public/README.md 3절).
# 자료 등급 키(data_class)를 최상위에 더해 본다.
name: gap-21-flag-key
task: 합성 회원 방문 기록의 방문 코드를 옮긴다
data_class: personal
steps:
  - name: 방문 코드 옮기기
    answers: {input_kind: table, rule_expressible: yes, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: human, minutes_per_item: 2, failure_impact: safety_legal, existing_feature: no, human_signoff: no}
inputs:
  reference: reference/*.csv
  candidate: candidate/*.csv
  key: member_id
compare:
  - {field: visit_code}
thresholds:
  accuracy_min: 95
  missing_max: 2
  time_must_drop: false
