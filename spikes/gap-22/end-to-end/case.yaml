# 합성 예시. 실제 업무·값 없음. 잠재 빈 곳 22 확인용(docs/cases-public/README.md 3절).
# AI가 읽은 금액을 그대로 2단계에 넣은 최종 합계를 잰다.
name: gap-22-end-to-end
task: 합성 영수증 금액을 읽고(1단계) 거래처별 합계를 낸다(2단계)
steps:
  - name: 영수증 금액 읽기
    answers: {input_kind: image, rule_expressible: yes, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: ai_each_time, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
  - name: 거래처별 합계 내기
    answers: {input_kind: table, rule_expressible: yes, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: human, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
inputs:
  reference: reference/*.csv
  candidate: candidate/*.csv
  key: vendor_code
compare:
  - {field: total, tolerance: 0}
thresholds:
  accuracy_min: 95
  missing_max: 2
  time_must_drop: false
