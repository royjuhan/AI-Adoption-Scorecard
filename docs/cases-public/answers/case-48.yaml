# 공개 사례 1절 48번의 업무 구조만 합성했다. 실제 회사·제품·수치 없음.
# 1절 예상: 요약 ③ · 고객 관리 기록 채우기 ② · 확정 ④. 과잉 후보: 기록 칸 채우기.
# 요약에 없음(기본값, 확인 필요): frequency, batch_size, exception_rate, minutes_per_item, existing_feature.
# inferred: 1절 요약이 직접 말하지 않아 업무 구조에서 추정한 답.
name: case-48
task: 고객 미팅 내용을 요약해 고객 관리 기록 칸을 채우고, 담당자가 확정한다
steps:
  - name: 미팅 내용 요약
    answers: {input_kind: conversation, rule_expressible: no, current_actor: ai_each_time, human_signoff: no}
    inferred: [rule_expressible]
  # 요약의 정해진 칸을 기록 칸에 옮긴다고 보았다. 지금 AI가 매번 한다(과잉 후보).
  - name: 고객 관리 기록 칸 채우기
    answers: {input_kind: fixed_form, rule_expressible: yes, current_actor: ai_each_time, human_signoff: no}
    inferred: [input_kind]
  # 담당자 확정(확정 ④). 요약이 "확정"이라 서명 단계로 적었다.
  - name: 담당자 확정
    answers: {current_actor: human, human_signoff: yes}
