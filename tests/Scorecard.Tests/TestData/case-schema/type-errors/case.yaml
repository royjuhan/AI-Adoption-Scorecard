name: Sample_Bad
task: 형식 오류 합성 예시
ai_usage: always
steps:
  - name: 첫 단계
    answers:
      input_kind: Table
      frequency: Weekly
      batch_size: ten
      exception_rate: 120
      minutes_per_item: "5"
      existing_feature: maybe
  - name: 둘째 단계
    answers:
      batch_size: 0
      exception_rate: 1,5
      current_actor: [human]
  - 셋째 단계
compare:
  - {field: a, tolerance: 1, tolerance_pct: 2}
  - {field: b, tolerance: -1}
inputs:
  reference: /data/ref.csv
  candidate: ../candidate/*.csv
  key: id
thresholds:
  accuracy_min: 101
  time_must_drop: yes
