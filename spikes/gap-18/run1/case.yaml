# 합성 예시. 실제 업무·값 없음. 잠재 빈 곳 18 확인용(docs/cases-public/README.md 3절).
# 1번째 check. 기준 자료는 같고 결과 자료만 새로 받았다.
name: gap-18-drift
task: 합성 측정값을 결과표에 옮긴다. 같은 케이스를 세 번 check한다
steps:
  - name: 합성 측정값 옮기기
    answers: {input_kind: table, rule_expressible: yes, frequency: weekly, batch_size: 20, exception_rate: 5, current_actor: human, minutes_per_item: 2, failure_impact: internal_rework, existing_feature: no, human_signoff: no}
inputs:
  reference: reference/*.csv
  candidate: candidate/*.csv
  key: row_id
compare:
  - {field: value, tolerance: 0}
thresholds:
  accuracy_min: 90
  missing_max: 2
  time_must_drop: false
